<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Faucet Monitoring</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; margin: 0; }
    .container { max-width: 680px; margin: auto; background: #1e293b; padding: 24px; border-radius: 16px; }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; }
    .status-box { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 16px; border-radius: 12px; margin-bottom: 20px; }
    .badge { padding: 6px 14px; border-radius: 999px; font-weight: bold; text-transform: uppercase; }
    .idle { background: #334155; color: #e2e8f0; }
    .active { background: #16a34a; color: #ffffff; }
    .anomaly { background: #dc2626; color: #ffffff; }
    button { background: #eab308; color: #0f172a; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
    th, td { padding: 10px; border-bottom: 1px solid #334155; text-align: left; }
    th { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Dashboard Smart Faucet</h2>
    <div class="status-box">
      <div>Status Sistem: <span id="stateBadge" class="badge idle">IDLE</span></div>
      <button id="btnResolve" onclick="resolveAnomaly()" disabled>Selesaikan Anomali</button>
    </div>
    <h3>Riwayat Penggunaan Terbaru</h3>
    <table>
      <thead>
        <tr>
          <th>Waktu</th>
          <th>Durasi (Detik)</th>
          <th>Keterangan</th>
        </tr>
      </thead>
      <tbody id="logTable"></tbody>
    </table>
  </div>

  <script>
    function loadData() {
      fetch('/api/data')
        .then(res => res.json())
        .then(data => {
          const badge = document.getElementById('stateBadge');
          const btn = document.getElementById('btnResolve');
          badge.textContent = data.state;
          badge.className = 'badge ' + data.state;
          btn.disabled = (data.state !== 'anomaly');

          const tbody = document.getElementById('logTable');
          tbody.innerHTML = '';
          (data.logs || []).forEach(log => {
            tbody.innerHTML += `<tr>
              <td>${log.timestamp || '-'}</td>
              <td>${log.duration} dtk</td>
              <td>${log.status_type}</td>
            </tr>`;
          });
        });
    }

    function resolveAnomaly() {
      fetch('/api/resolve-anomaly', { method: 'POST' })
        .then(res => res.json())
        .then(() => loadData());
    }

    setInterval(loadData, 1500);
    loadData();
  </script>
</body>
</html>
