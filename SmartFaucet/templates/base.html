<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} - Smart Faucet</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-page="{{ page|default('') }}">
  {% if show_sidebar|default(true) %}
  <button type="button" class="menu-toggle" id="menuToggle" aria-label="Buka menu" aria-expanded="false">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-icon">💧</span> SmartFaucet</div>
    <nav class="sidebar-nav" aria-label="Navigasi utama">
      <a href="{{ url_for('index') }}" class="nav-link{{ ' active' if page == 'dashboard' else '' }}"{{ ' aria-current="page"' if page == 'dashboard' else '' }}>Dashboard</a>
      <a href="{{ url_for('riwayat') }}" class="nav-link{{ ' active' if page == 'riwayat' else '' }}"{{ ' aria-current="page"' if page == 'riwayat' else '' }}>Riwayat</a>
      <a href="{{ url_for('pengaturan') }}" class="nav-link{{ ' active' if page == 'pengaturan' else '' }}"{{ ' aria-current="page"' if page == 'pengaturan' else '' }}>Pengaturan</a>
      <a href="{{ url_for('logout') }}" class="nav-link nav-logout">Logout</a>
    </nav>
    <div class="sidebar-footer">
      <span class="user-dot"></span>
      {{ session.get('username', 'Teknisi') }}
    </div>
  </aside>
  {% endif %}

  <main class="main-content{% if not show_sidebar|default(true) %} auth-main{% endif %}">
    {% block header %}
    <header class="page-header">
      <h1>{{ title }}</h1>
      {% block subtitle %}{% endblock %}
    </header>
    {% endblock %}

    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
